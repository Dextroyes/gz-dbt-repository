# schema.yaml

 version: 2

 sources:
   - name: raw
     schema: gz_raw_data
     tables:
       - name: sales
         identifier: raw_gz_sales
         description: sales of Greenweez / we have on row per product_id found in each orders_id

         # Freshness testing -
         loaded_at_field: "CAST(date_date AS TIMESTAMP)"
         freshness:
           warn_after: {count: 90, period: day}

         columns:
           - name: date_date
             description: date of purchase / add a test unique
       - name: product
         identifier: raw_gz_product
         description: products of Greenweez / we have our products with their ad and their prices
         columns:
           - name: products_id
             description: products of Greenweez / add a test unique and not null
             tests:
                - unique
                - not_null
       - name: ship
         identifier: raw_gz_ship
         description: ship of Greenweez / we have the orders and their shipping costs
         columns:
           - name: orders_id
             description: products of Greenweez / add a test unique and not null
             tests:
                - unique
                - not_null
       - name: adwords
         identifier: raw_gz_adwords
       - name: bing
         identifier: raw_gz_bing
       - name: criteo
         identifier: raw_gz_criteo
       - name: facebook
         identifier: raw_gz_facebook
         
 models:
       - name: campaigns
         identifier: int_campaigns
         columns:
           - name: "(date_date || '_' || campaign_key)"
             tests:
                - unique
                - not_null

       - name: campaigns_day
         identifier: int_campaigns_day
         columns:
           - name: date_date
             tests:
                - unique
                - not_null
       - name: finance_campaigns_day
         identifier: finance_campaign_day
         columns:
           - name: date_date
             tests:
                - unique
                - not_null